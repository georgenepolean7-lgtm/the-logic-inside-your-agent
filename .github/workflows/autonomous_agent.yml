name: 24/7 Autonomous Market Hunter

on:
  schedule:
    # Runs automatically every 4 hours (24/7 Cloud Execution)
    - cron: '0 */4 * * *'
  # Allows instant manual 1-click execution from GitHub Actions web tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-autonomous-hunter:
    name: Execute Auto-Pilot Market Hunter
    runs-on: ubuntu-latest

    steps:
      - name: 🛎️ Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Execute Autonomous Agent Cycle
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_API_KEY: ${{ secrets.WHATSAPP_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GREEN_API_INSTANCE_ID: ${{ secrets.GREEN_API_INSTANCE_ID }}
          GREEN_API_TOKEN: ${{ secrets.GREEN_API_TOKEN }}
          META_WHATSAPP_TOKEN: ${{ secrets.META_WHATSAPP_TOKEN }}
          META_PHONE_NUMBER_ID: ${{ secrets.META_PHONE_NUMBER_ID }}
          WHATSAPP_TO_PHONE: ${{ secrets.WHATSAPP_TO_PHONE }}
        run: |
          python auto_agent.py --once

      - name: 💾 Commit & Push Updated Database
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add products_history.db
          if git diff --staged --quiet; then
            echo "No database changes to commit."
          else
            git commit -m "🤖 Auto-Agent: Update market data & shortlist [skip ci]"
            git push
          fi
